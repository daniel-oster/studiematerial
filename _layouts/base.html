<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Familjen+Grotesk:wght@400;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="topbar">
    <div class="inner toprow">
      <a href="{{ '/' | relative_url }}" class="brand">{{ site.title }}</a>
      {% include breadcrumbs.html %}
      <button type="button" class="refresh" id="refresh" aria-label="Ladda om sidan med senaste versionen" title="Ladda om med senaste versionen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
    </div>
  </header>
  <main class="inner">
    {{ content }}
  </main>
<script>
/* Hård refresh: hämtar sidan och dess stilmallar förbi webbläsarens cache, rensar eventuella cache-lager och laddar om. */
(function(){
  var b=document.getElementById('refresh'); if(!b) return;
  b.addEventListener('click', function(){
    if(b.disabled) return;
    b.disabled=true; b.classList.add('busy');
    var urls=[location.href.split('#')[0]];
    [].forEach.call(document.querySelectorAll('link[rel="stylesheet"][href]'), function(l){ if(l.href.indexOf(location.origin)===0) urls.push(l.href); });
    var jobs=urls.map(function(u){ return fetch(u,{cache:'reload'}).catch(function(){}); });
    if(window.caches && caches.keys) jobs.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); }).catch(function(){}));
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations) jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); }).catch(function(){}));
    Promise.all(jobs).then(function(){ location.reload(); });
    setTimeout(function(){ location.reload(); }, 4000);
  });
})();
</script>
</body>
</html>
